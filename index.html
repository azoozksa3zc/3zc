<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3ZC SERVER</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            /* خلفية ليلية متدرجة فخمة متناسقة مع ألوان صورة السيرفر */
            background: radial-gradient(circle at center, #0a0f1d 0%, #03050a 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* غطاء الهيدر الفخم باستخدام صورة شخصية السيرفر */
        .server-banner {
            width: 100%;
            max-width: 500px;
            height: 180px;
            background-image: url('https://images.squarespace-cdn.com/content/v1/66042b322a36d933e8b0b5cc/ec433b5c-4fdf-44be-b33a-13170e309be0/3ZC+Banner.jpg');
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 0 0 24px 24px;
            margin-bottom: 30px;
            position: relative;
        }

        /* تظليل سفلي ناعم على الصورة لدمجها مع الخلفية */
        .server-banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, #0a0f1d, transparent);
        }

        /* الحاوية الرئيسية للأزرار والمحتوى */
        .main-container {
            width: 92%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 28px;
            padding: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        /* الأزرار الرئيسية المتوهجة ذات اللمعان */
        .btn-purple {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            /* لون أزرق ليلكي غامق فخم متناسق مع الصورة الجديدة */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: white;
            padding: 18px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 18px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* تأثير اللمعان الفخم المتحرك تلقائياً على الأزرار */
        .btn-purple::after {
            content: '';
            position: absolute;
            top: 0;
            right: -60%;
            width: 30%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(56, 189, 248, 0.3), transparent);
            transform: skewX(-25deg);
            animation: lightShine 4s infinite ease-in-out;
        }

        @keyframes lightShine {
            0% { right: -60%; }
            25% { right: 140%; }
            100% { right: 140%; }
        }

        /* حركة الزر والتوهج عند تمرير الماوس أو اللمس */
        .btn-purple:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.3);
            border-color: rgba(56, 189, 248, 0.6);
            background: linear-gradient(135deg, #273549 0%, #131d31 100%);
        }

        .btn-purple svg {
            width: 20px;
            height: 20px;
            fill: #38bdf8;
            filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.5));
        }

        /* بطاقة قسم المميزات */
        .features-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 22px;
            padding: 22px;
            margin-top: 10px;
        }

        .features-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #38bdf8;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        /* قائمة المميزات */
        .features-list {
            list-style: none;
        }

        .features-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.05rem;
            color: #e2e8f0;
        }

        .features-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        /* الأيقونات النجمية المتوهجة باللون الأزرق المضيء */
        .sparkle-icon {
            color: #38bdf8;
            font-size: 1.2rem;
            filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.8));
        }
    </style>
</head>
<body>

    <div class="server-banner"></div>

    <div class="main-container">

        <a href="#" class="btn-purple">
            <span>Delta Install</span>
            <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18L5.33 11h4V16h5.34v-5h4L12 2z"/></svg>
        </a>

        <a href="#" class="btn-purple">
            <span>Delta VNG Install</span>
            <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18L5.33 11h4V16h5.34v-5h4L12 2z"/></svg>
        </a>

        <div class="features-card">
            <h2 class="features-title">مميزات هاك سكيبكس</h2>
            
            <ul class="features-list">
                <li class="features-item">
                    <span>من غير مفتاح</span>
                    <span class="sparkle-icon">✦</span>
                </li>
                <li class="features-item">
                    <span>يوجد بحث سكريبتات</span>
                    <span class="sparkle-icon">✦</span>
                </li>
            </ul>
        </div>

    </div>

</body>
</html>
