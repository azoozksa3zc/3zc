<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3ZC COMMUNITY</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-main: #060913; --neon-blue: #00d2ff; --text-main: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #060913; color: var(--text-main); min-height: 100vh; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid rgba(0, 210, 255, 0.2); background: rgba(6, 9, 19, 0.95); }
        .brand { font-size: 1.8rem; font-weight: 900; cursor: pointer; text-shadow: 0 0 15px var(--neon-blue); }
        
        /* القائمة الجانبية المتميزة */
        .sidebar { position: fixed; top: 0; left: -300px; width: 250px; height: 100%; z-index: 600; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); padding: 40px 20px; border-left: 2px solid var(--neon-blue); background: linear-gradient(180deg, #0a0f1d 0%, #060913 100%); box-shadow: -10px 0 30px rgba(0,0,0,0.8); }
        .sidebar.active { left: 0; }
        .sidebar ul { list-style: none; margin-top: 50px; }
        .sidebar li { margin: 30px 0; font-size: 1.1rem; border-bottom: 1px solid rgba(0,210,255,0.1); padding-bottom: 15px; }
        
        /* لمسة احترافية للفراغ */
        .sidebar-footer { position: absolute; bottom: 40px; left: 0; width: 100%; text-align: center; font-size: 0.8rem; color: var(--neon-blue); opacity: 0.6; }

        .card { background: rgba(15, 22, 42, 0.6); border: 1px solid rgba(0,210,255,0.1); border-radius: 20px; padding: 25px; margin-bottom: 20px; }
        .btn { position: relative; overflow: hidden; display: block; width: 100%; padding: 15px; margin-top: 10px; border-radius: 10px; font-weight: 700; text-decoration: none; color: #fff; text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: 0.4s; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; background: #ff4444; color: #fff; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
        .footer { text-align: center; padding: 30px; color: #475569; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <button onclick="toggleMenu()" style="background:none; border:none; color:white; font-size:1.8rem; cursor:pointer;">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <ul>
            <li><a id="side-discord" href="#" target="_blank" style="color:white; text-decoration:none;"><i class="fa-brands fa-discord"></i> الدعم الفني</a></li>
            <li><a href="#" onclick="document.getElementById('aboutModal').style.display='flex'; toggleMenu();" style="color:white; text-decoration:none;"><i class="fa-solid fa-circle-info"></i> من نحن</a></li>
            <li><a href="#" style="color:white; text-decoration:none; opacity:0.5; cursor:default;"><i class="fa-brands fa-youtube"></i> يوتيوب (قريباً)</a></li>
        </ul>
        <div class="sidebar-footer">3ZC COMMUNITY<br>إبداع بلا حدود</div>
    </div>

    <div class="navbar">
        <div class="brand" onclick="toggleMenu()">3ZC</div>
        <h1 style="font-size: 1.2rem;">3ZC COMMUNITY</h1>
        <div style="width: 40px;"></div>
    </div>
    
    <div style="padding: 40px 20px; max-width: 500px; margin: 0 auto; width: 100%;">
        <div class="card">
            <span class="status-badge">الشهادة: متوقفة ❌</span>
            <h3>تطبيقات iOS 📱</h3>
            <a href="itms-services://?action=download-manifest&url=https://delta.bz/manifest.plist" class="btn" style="background: var(--neon-blue); color:#000;">تحميل وتثبيت النسخة 🚀</a>
        </div>
        <div class="card">
            <h3>هاك الاندرويد 🤖</h3>
            <a id="android-hack" href="#" target="_blank" class="btn">الانتقال للسيرفر 🚀</a>
        </div>
        <div class="card">
            <h3>هاك البي سي 💻</h3>
            <a id="pc-hack" href="#" target="_blank" class="btn">الانتقال للسيرفر 🚀</a>
        </div>
        <div class="card">
            <h3>فروعنا 🔗</h3>
            <a id="main-discord" href="#" target="_blank" class="btn" style="background:#5865F2;"><i class="fa-brands fa-discord"></i> سيرفر الديسكورد</a>
        </div>
    </div>

    <script>
        const C = { 
            discord: "https://discord.gg/w7ySdyDb", 
            android: "https://discord.com/channels/1512974522914177104/1513655085366902804", 
            pc: "https://discord.com/channels/1512974522914177104/1513655224022204416"
        };
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
        document.getElementById('side-discord').href = C.discord;
        document.getElementById('main-discord').href = C.discord;
        document.getElementById('android-hack').href = C.android;
        document.getElementById('pc-hack').href = C.pc;
    </script>
</body>
</html>
