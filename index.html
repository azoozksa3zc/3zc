<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3ZC COMMUNITY</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: rgba(15, 22, 42, 0.75);
            --neon-blue: #00d2ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #00ff66;
            --danger: #ff3333;
            --neon-glow: 0 0 20px rgba(0, 210, 255, 0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: radial-gradient(circle at top, #111a2e 0%, var(--bg-main) 100%);
            color: var(--text-main); min-height: 100vh; padding-bottom: 40px; overflow-x: hidden;
        }
        .navbar {
            display: flex; justify-content: space-between; align-items: center; padding: 20px;
            backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            position: sticky; top: 0; z-index: 100; background: rgba(6, 9, 19, 0.9);
        }
        .brand { 
            font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
            text-shadow: 0 0 20px var(--neon-blue);
            animation: pulseGlow 3s infinite alternate;
        }
        .menu-btn { background: none; border: none; color: var(--text-main); font-size: 1.8rem; cursor: pointer; transition: 0.3s; }
        .menu-btn:hover { color: var(--neon-blue); }
        
        .sidebar {
            position: fixed; top: 0; right: -100%; width: 75%; height: 100%;
            background: #060913; z-index: 102; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.8); padding: 40px 20px;
            border-left: 1px solid var(--neon-blue);
        }
        .sidebar.active { right: 0; }
        .sidebar .close-btn { font-size: 2rem; background: none; border: none; color: #fff; cursor: pointer; }
        .sidebar-menu { list-style: none; margin-top: 80px; }
        .sidebar-menu li { margin: 30px 0; }
        .sidebar-menu a { color: var(--text-main); text-decoration: none; font-size: 1.3rem; display: block; border-right: 3px solid transparent; padding-right: 15px; transition: 0.3s; }
        .sidebar-menu a:hover { color: var(--neon-blue); border-right: 3px solid var(--neon-blue); }
        
        .hero { padding: 60px 20px; text-align: center; }
        .hero-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; color: #fff; text-transform: uppercase; }
        
        .content { padding: 0 20px; max-width: 500px; margin: 0 auto; }
        .card {
            background: rgba(15, 22, 42, 0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px;
            padding: 25px; margin-bottom: 20px; backdrop-filter: blur(10px); transition: 0.4s;
            position: relative; overflow: hidden;
        }
        .card:hover { border-color: var(--neon-blue); transform: translateY(-5px); }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; }
        
        .btn {
            display: block; width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 8px;
            text-align: center; font-weight: 700; text-decoration: none; color: #fff;
            transition: 0.3s; border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-primary { background: var(--neon-blue); color: #000; border: none; }
        .btn-discord { background: #5865F2; }
        .btn-youtube { background: #FF0000; }
        .btn:hover { opacity: 0.8; transform: scale(1.02); }

        .suggestion-input {
            width: 100%; padding: 12px; border-radius: 8px; background: #0b132b;
            border: 1px solid rgba(255,255,255,0.1); color: #fff; margin-bottom: 10px;
        }

        @keyframes pulseGlow { 0% { text-shadow: 0 0 10px var(--neon-blue); } 100% { text-shadow: 0 0 25px var(--neon-blue); } }
    </style>
</head>
<body>

    <script>
        const MY_CONFIG = {
            serverName: "3ZC COMMUNITY",
            discord: "https://discord.gg/w7ySdyDb",      
            iosLink: "https://google.com",          
            androidLink: "https://discord.com/channels/1512974522914177104/1513655085366902804",      
            pcLink: "https://discord.com/channels/1512974522914177104/1513655224022204416",
            webhookUrl: "https://discord.com/api/webhooks/1516749514604675156/NKnaBtezZstYhxLSnp9C6cxVx_cb9anymgfiGD4cTEmi_qtVXJ5mjcB5WuGv-rwwrqOQ"            
        };
    </script>

    <div class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleMenu()">✕</button>
        <ul class="sidebar-menu">
            <li><a href="#" onclick="toggleMenu()">الرئيسية</a></li>
            <li><a id="menu-discord" href="#" target="_blank">الدعم الفني</a></li>
        </ul>
    </div>

    <div class="navbar">
        <div class="brand">3ZC</div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
    
    <div class="hero"><h1 class="hero-title">3ZC COMMUNITY</h1></div>
    
    <div class="content">
        <div class="card">
            <div class="card-title">تطبيقات iOS</div>
            <a id="ios-hack" href="#" target="_blank" class="btn btn-primary">تحميل نسخة ايفون</a>
        </div>
        <div class="card">
            <div class="card-title">هاك الاندرويد</div>
            <a id="android-hack" href="#" target="_blank" class="btn btn-primary">تحميل نسخة أندرويد</a>
        </div>
        <div class="card">
            <div class="card-title">هاك البي سي</div>
            <a id="pc-hack" href="#" target="_blank" class="btn btn-primary">تحميل نسخة بي سي</a>
        </div>
        <div class="card">
            <div class="card-title">فروعنا</div>
            <a id="main-discord" href="#" target="_blank" class="btn btn-discord">سيرفر الديسكورد</a>
            <a id="main-youtube" href="#" class="btn btn-youtube">يوتيوب</a>
        </div>
        <div class="card">
            <div class="card-title">اقتراحاتكم للموقع</div>
            <textarea id="suggestion-text" class="suggestion-input" rows="3" placeholder="اكتب اقتراحك هنا..."></textarea>
            <button id="send-btn" onclick="sendSuggestion()" class="btn btn-primary">إرسال الاقتراح</button>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
        document.getElementById('main-discord').href = MY_CONFIG.discord;
        document.getElementById('menu-discord').href = MY_CONFIG.discord;
        document.getElementById('ios-hack').href = MY_CONFIG.iosLink;
        document.getElementById('android-hack').href = MY_CONFIG.androidLink;
        document.getElementById('pc-hack').href = MY_CONFIG.pcLink;
        
        function sendSuggestion() {
            const btn = document.getElementById('send-btn');
            const text = document.getElementById('suggestion-text').value.trim();
            if(!text) { alert('الرجاء كتابة الاقتراح!'); return; }
            btn.disabled = true; btn.innerText = "انتظر 30 ثانية...";
            fetch(MY_CONFIG.webhookUrl, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ embeds: [{ title: "📥 اقتراح جديد", description: text, color: 0x00d2ff }] })
            }).then(() => {
                alert('تم الإرسال!'); document.getElementById('suggestion-text').value = '';
                let timer = 30;
                const countdown = setInterval(() => {
                    timer--; btn.innerText = "انتظر " + timer + " ثانية...";
                    if(timer <= 0) { clearInterval(countdown); btn.disabled = false; btn.innerText = "إرسال الاقتراح"; }
                }, 1000);
            }).catch(() => { alert('خطأ!'); btn.disabled = false; btn.innerText = "إرسال الاقتراح"; });
        }
    </script>
</body>
</html>
