<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3ZC COMMUNITY</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: rgba(15, 22, 42, 0.75);
            --neon-blue: #00d2ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #00ff66;
            --danger: #ff3333;
            --neon-glow: 0 0 20px rgba(0, 210, 255, 0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: radial-gradient(circle at top, #111a2e 0%, var(--bg-main) 100%);
            color: var(--text-main); min-height: 100vh; padding-bottom: 40px; overflow-x: hidden;
        }
        .navbar {
            display: flex; justify-content: space-between; align-items: center; padding: 20px;
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 210, 255, 0.15);
            position: sticky; top: 0; z-index: 100; background: rgba(6, 9, 19, 0.85);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }
        .brand { 
            font-size: 1.6rem; font-weight: 900; letter-spacing: 1px; 
            text-shadow: 0 0 15px var(--neon-blue);
            animation: pulseGlow 3s infinite alternate;
        }
        .menu-btn { background: none; border: none; color: var(--text-main); font-size: 1.8rem; cursor: pointer; transition: 0.3s ease; }
        .menu-btn:hover { color: var(--neon-blue); text-shadow: var(--neon-glow); }
        
        .sidebar {
            position: fixed; top: 0; right: -100%; width: 75%; height: 100%;
            background: #0b132b; z-index: 102; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -5px 0 30px rgba(0,0,0,0.6); padding: 40px 20px;
            border-left: 1px solid rgba(0, 210, 255, 0.2);
        }
        .sidebar.active { right: 0; }
        .sidebar .close-btn { font-size: 2rem; background: none; border: none; color: #fff; float: right; cursor: pointer; transition: 0.3s ease; }
        .sidebar .close-btn:hover { color: var(--danger); }
        .sidebar-menu { list-style: none; margin-top: 60px; padding: 0; }
        .sidebar-menu li { margin: 25px 0; }
        .sidebar-menu a { color: var(--text-main); text-decoration: none; font-size: 1.2rem; display: block; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: right; transition: 0.3s ease; }
        .sidebar-menu a:hover { color: var(--neon-blue); padding-right: 15px; border-bottom: 1px solid var(--neon-blue); }

        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 101; display:none; }
        .overlay.active { display:block; }

        .hero { padding: 40px 20px; text-align: center; }
        .hero-title { 
            font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; 
            background: linear-gradient(135deg, #f8fafc 40%, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-desc { color: var(--text-muted); font-size: 1rem; }

        .content { padding: 0 20px; display: flex; flex-direction: column; gap: 20px; max-width: 500px; margin: 0 auto; }

        .card {
            background: var(--bg-card); border-radius: 20px;
            padding: 24px; border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; text-align:center; }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 14px; margin-bottom: 12px;
            border-radius: 14px; text-decoration: none; font-weight: 700;
            position: relative; overflow: hidden;
        }

        .btn-primary { background: linear-gradient(135deg,#0052d4,#6fb1fc); color:#fff; }
        .btn-discord { background:#5865F2; color:#fff; }
        .btn-youtube { background:#FF0000; color:#fff; }

        /* Discord icon glow */
        .discord-icon{
            width:18px;
            height:18px;
            display:inline-block;
            background:#fff;
            mask: url("https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg") center/contain no-repeat;
            -webkit-mask: url("https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg") center/contain no-repeat;
            filter: drop-shadow(0 0 10px #5865F2);
            animation: glow 1.8s infinite alternate;
        }

        /* YouTube icon */
        .youtube-icon{
            width:18px;
            height:18px;
            display:inline-block;
            background:#fff;
            mask: url("https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg") center/contain no-repeat;
            -webkit-mask: url("https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg") center/contain no-repeat;
            filter: drop-shadow(0 0 8px #ff0000);
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 4px #5865F2); }
            to { filter: drop-shadow(0 0 14px #5865F2); }
        }

        .footer { text-align:center; margin-top:40px; color:var(--text-muted); font-size:0.85rem; }
    </style>
</head>
<body>

<script>
const MY_CONFIG = {
    serverName: "3ZC COMMUNITY",
    discord: "https://discord.gg/w7ySdyDb",
    youtube: "#",
    iosStatus: "شغالة",
    iosLink: "https://google.com",
    androidLink: "https://discord.com/channels/1512974522914177104/1513655085366902804",
    pcLink: "https://discord.com/channels/1512974522914177104/1513655224022204416",
    webhookUrl: "https://discord.com/api/webhooks/1516735490659975208/TOKEN_HERE"
};
</script>

<div class="navbar">
    <div class="brand" id="nav-title"></div>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
</div>

<div class="hero">
    <div class="hero-title">موقع 3ZC COMMUNITY</div>
    <div class="hero-desc">تجربة تحميل وتحديثات</div>
</div>

<div class="content">

    <div class="card">
        <div class="card-title">فروعنا</div>

        <a href="#" class="btn btn-discord">
            <span class="discord-icon"></span>
            سيرفر الديسكورد
        </a>

        <a href="#" class="btn btn-youtube">
            <span class="youtube-icon"></span>
            قريباً
        </a>
    </div>

    <div class="card">
        <div class="card-title">اقتراحاتكم</div>
        <textarea id="suggestion-text" style="width:100%;padding:10px;border-radius:10px;"></textarea>
        <button class="btn btn-primary" onclick="sendSuggestion()">إرسال</button>
    </div>

</div>

<div class="footer">© 2026 3ZC COMMUNITY</div>

<script>
document.getElementById('nav-title').innerText = MY_CONFIG.serverName;

let lastSendTime = 0;

function sendSuggestion(){
    const text = document.getElementById('suggestion-text').value.trim();
    if(!text) return alert("اكتب اقتراح");

    const now = Date.now();
    if(now - lastSendTime < 30000){
        return alert("انتظر شوي");
    }
    lastSendTime = now;

    fetch(MY_CONFIG.webhookUrl,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            embeds:[{
                title:"اقتراح",
                description:text
            }]
        })
    }).then(()=>alert("تم")).catch(()=>alert("خطأ"));
}
</script>

</body>
</html>
