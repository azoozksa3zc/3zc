<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3ZC COMMUNITY</title>
    <style>
        :root { --bg-main: #060913; --neon-blue: #00d2ff; --text-main: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: radial-gradient(circle at top, #111a2e 0%, var(--bg-main) 100%); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px; backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 210, 255, 0.2); position: sticky; top: 0; z-index: 100; background: rgba(6, 9, 19, 0.9); }
        .brand { font-size: 1.8rem; font-weight: 900; cursor: pointer; text-shadow: 0 0 15px var(--neon-blue); transition: 0.3s; }
        .brand:hover { color: var(--neon-blue); }
        
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: #0b132b; padding: 30px; border-radius: 20px; max-width: 400px; text-align: center; border: 1px solid var(--neon-blue); }
        
        .hero { padding: 60px 20px; text-align: center; }
        .content { padding: 0 20px; max-width: 500px; margin: 0 auto; }
        .card { background: rgba(15, 22, 42, 0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 25px; margin-bottom: 20px; transition: 0.4s; }
        .card:hover { border-color: var(--neon-blue); }
        
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 8px; font-weight: 700; text-decoration: none; color: #fff; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .btn:hover { opacity: 0.8; }
        .btn-discord { background: #5865F2; }
        .btn-youtube { background: #FF0000; }
        svg { width: 24px; height: 24px; fill: white; }
    </style>
</head>
<body>

    <div class="modal" id="aboutModal" onclick="this.style.display='none'">
        <div class="modal-content">
            <h2>عن 3ZC</h2>
            <p style="margin-top: 15px; color: #94a3b8;">مجتمع تقني متكامل يقدم أحدث التعديلات والتحسينات الرقمية بجودة عالية واحترافية.</p>
        </div>
    </div>

    <div class="navbar">
        <div class="brand" onclick="document.getElementById('aboutModal').style.display='flex'">3ZC</div>
    </div>
    
    <div class="hero"><h1>3ZC COMMUNITY</h1></div>
    
    <div class="content">
        <div class="card">
            <h3>تطبيقات iOS</h3>
            <a id="ios-hack" href="#" target="_blank" class="btn" style="background:#0052d4">تحميل نسخة ايفون</a>
        </div>
        <div class="card">
            <h3>فروعنا</h3>
            <a id="main-discord" href="#" target="_blank" class="btn btn-discord">
                <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.97.077.077 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.126 10.29 10.29 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.969a.078.078 0 0 0 .085.028 19.839 19.839 0 0 0 5.992-3.03.077.077 0 0 0 .032-.057c.504-5.394-.81-10.158-3.386-14.482a.068.068 0 0 0-.031-.027zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.419 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.419 0 1.334-.946 2.419-2.157 2.419z"/></svg>
                سيرفر الديسكورد
            </a>
            <a id="main-youtube" href="#" class="btn btn-youtube">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.377.505 9.377.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                يوتيوب
            </a>
        </div>
    </div>

    <script>
        const config = { discord: "https://discord.gg/w7ySdyDb", ios: "https://google.com" };
        document.getElementById('main-discord').href = config.discord;
        document.getElementById('ios-hack').href = config.ios;
    </script>
</body>
</html>
