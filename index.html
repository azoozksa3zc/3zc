<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rtx261.github.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #140727 0%, #05010a 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* حاوية الشعار العلوي */
        .header-logo {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
        }

        .header-logo span {
            background: linear-gradient(45deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }

        /* الحاوية الرئيسية */
        .main-container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 28px;
            padding: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        /* الأزرار الرئيسية المتوهجة */
        .btn-purple {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #6322bc 0%, #411284 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 18px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 18px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(99, 34, 188, 0.2);
        }

        /* تأثير اللمعان الفخم المتحرك تلقائياً */
        .btn-purple::after {
            content: '';
            position: absolute;
            top: 0;
            right: -60%;
            width: 30%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.25), transparent);
            transform: skewX(-25deg);
            animation: lightShine 3.5s infinite ease-in-out;
        }

        @keyframes lightShine {
            0% { right: -60%; }
            30% { right: 140%; }
            100% { right: 140%; }
        }

        .btn-purple:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4);
            border-color: rgba(255, 255, 255, 0.25);
            background: linear-gradient(135deg, #742cd4 0%, #4e199c 100%);
        }

        .btn-purple svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* بطاقة قسم المميزات */
        .features-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 22px;
            padding: 22px;
            margin-top: 10px;
        }

        .features-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #38bdf8;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        /* قائمة المميزات الفخمة */
        .features-list {
            list-style: none;
        }

        .features-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.05rem;
            color: #e2e8f0;
        }

        .features-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        /* الأيقونات النجمية المتوهجة */
        .sparkle-icon {
            color: #c084fc;
            font-size: 1.2rem;
            filter: drop-shadow(0 0 5px rgba(192, 132, 252, 0.6));
        }
    </style>
</head>
<body>

    <div class="header-logo">
        <span>RTX</span>
    </div>

    <div class="main-container">

        <a href="#" class="btn-purple">
            <span>Delta Install</span>
            <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18L5.33 11h4V16h5.34v-5h4L12 2z"/></svg>
        </a>

        <a href="#" class="btn-purple">
            <span>Delta VNG Install</span>
            <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18L5.33 11h4V16h5.34v-5h4L12 2z"/></svg>
        </a>

        <div class="features-card">
            <h2 class="features-title">مميزات هاك سكيبكس</h2>
            
            <ul class="features-list">
                <li class="features-item">
                    <span>من غير مفتاح</span>
                    <span class="sparkle-icon">✦</span>
                </li>
                <li class="features-item">
                    <span>يوجد بحث سكريبتات</span>
                    <span class="sparkle-icon">✦</span>
                </li>
            </ul>
        </div>

    </div>

</body>
</html>
